[package]
name = "defender-watch"
version = "0.1.0"
edition = "2021"
description = "Portable Windows tray monitor for Microsoft Defender scan CPU hotspots."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winrt-notification = "0.5"
